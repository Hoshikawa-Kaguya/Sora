name: NuGet Publish

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master, dev]

permissions:
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download NuGet packages
        id: download
        uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: ./nupkg
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Decide whether to publish
        id: gate
        if: steps.download.outcome == 'success'
        shell: bash
        run: |
          if [ ! -f ./nupkg/release-metadata.json ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION_CHANGED=$(jq -r '.versionChanged' ./nupkg/release-metadata.json)
          PRERELEASE=$(jq -r '.isPrerelease' ./nupkg/release-metadata.json)
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          PUBLISH=false
          if [ "$VERSION_CHANGED" = "true" ] && [ "$BRANCH" = "master" ] && [ "$PRERELEASE" = "false" ]; then
            PUBLISH=true
          elif [ "$VERSION_CHANGED" = "true" ] && [ "$BRANCH" = "dev" ] && [ "$PRERELEASE" = "true" ]; then
            PUBLISH=true
          fi
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Push to NuGet
        if: steps.gate.outputs.publish == 'true'
        run: >-
          dotnet nuget push "./nupkg/*.nupkg"
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
